<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOJO Access Agent</title>
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #1c1917;
        --muted: #78716c;
        --ok: #047857;
        --warn: #b45309;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 20px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 6px;
      }
      #detail {
        color: var(--muted);
        margin-bottom: 16px;
        font-size: 0.95rem;
      }
      #badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 16px;
      }
      #badge.ok {
        background: #d1fae5;
        color: var(--ok);
      }
      #badge.warn {
        background: #ffedd5;
        color: var(--warn);
      }
      h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      #logs {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .logs-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .logs-head h2 {
        margin: 0;
      }
      button.clear {
        border: 1px solid #d6d3d1;
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 0.75rem;
        cursor: pointer;
      }
      button.clear:hover {
        background: #f5f5f4;
      }
      .hint {
        margin-top: 14px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 16px;
      }
      button.primary {
        border: 0;
        background: #0f766e;
        color: #fff;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:hover {
        background: #0d9488;
      }
    </style>
  </head>
  <body>
    <h1>MOJO Access Agent</h1>
    <div id="badge" class="warn">Checking…</div>
    <p id="detail">—</p>
    <div class="actions">
      <button type="button" class="primary" id="editConfig">Update connection settings…</button>
    </div>
    <div class="logs-head">
      <h2>Recent activity</h2>
      <button type="button" class="clear" id="clearLogs">Clear logs</button>
    </div>
    <div id="logs">Waiting for logs…</div>
    <p class="hint">
      Closing this window keeps the agent running in the menu bar (colored circle).
      Click the circle for the menu — use <strong>Edit connection settings…</strong> to paste a new
      config. Door sync pauses only if you Quit.
    </p>
    <script src="./status.js"></script>
  </body>
</html>
