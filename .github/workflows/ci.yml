name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: https://e2e-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
  SUPABASE_SERVICE_ROLE_KEY: e2e-service-key
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  MFA_OTP_SECRET: ci-mfa-otp-secret-not-for-production
  GUEST_SESSION_SECRET: ci-guest-session-secret-not-for-production
  CRON_SECRET: ci-cron-secret-not-for-production
  ARKESEL_API_KEY: ci-arkesel-key
  ARKESEL_SENDER_ID: MOJO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check migrations
        run: npm run check:migrations

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          DISABLE_PUBLIC_SIGNUP: "false"
